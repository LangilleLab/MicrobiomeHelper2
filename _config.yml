title: "Microbiome Helper"
url: "https://microbiomehelper.ca"
baseurl: ""

# Theme
remote_theme: dieghernan/chulapa
theme: null

# Navigation & Style
chulapa-skin:
  skin: focal
  highlight:  cobalt2


# Plugins
plugins:
  - jekyll-remote-theme
  - jekyll-include-cache

kramdown:
  input: GFM
  toc_levels: 1..2

toc: true
toc_sticky: true

footer:
  copyright: |
    <div class="text-center my-3">
      <a href="https://morganlangille.com/" target="_blank" rel="noopener">
        <img src="/assets/images/LangilleLabLogo.png" alt="Langille Lab logo" style="max-height: 50px;">
      </a>
    </div>
    &copy; 2026 Langille Lab

navbar:
  style: classic
  expand: md
  nav:
    - title: "Home"
      url: /
    - title: What is the microbiome?
      url: /docs/microbiome-intro/
    - title: Bioinformaticians start here
      url: /docs/start-here/
    - title: Cheatsheet
      url: /docs/cheatsheet/
    - title: Marker gene
      url: /docs/marker-gene/
    - title: Metagenome
      url: /docs/metagenome/
    - title: Downstream analysis
      url: /docs/sop-downstream-analysis/
    - title: Tutorials
      url: /docs/tutorials/
    - title: Index
      url: /docs/site-index/
